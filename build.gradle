plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.21'
}

version = '1.0.0+mc26.2'
group = 'dev.linrtx.mc'

base {
    archivesName = 'linrtx-mc'
}

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
}

dependencies {
    minecraft 'com.mojang:minecraft:26.2'
    implementation 'net.fabricmc:fabric-loader:0.20.1'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.161.0+26.2'

    // Mod compatibility compile-time APIs (optional at runtime via FabricLoader checks)
    compileOnly 'maven.modrinth:sodium:mc26.2-0.9.2-fabric'
    compileOnly 'maven.modrinth:iris:1.11.4+26.2-fabric'
    compileOnly 'maven.modrinth:distanthorizons:3.3.3-26.2'
    compileOnly 'maven.modrinth:modmenu:20.0.3'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}

processResources {
    inputs.property 'version', project.version
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
    from('third_party/nvidia-dlss/lib') {
        include 'libnvidia-ngx-*.so*'
        into 'natives/linux-x86_64'
    }
}
